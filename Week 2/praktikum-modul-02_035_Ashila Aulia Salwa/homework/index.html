<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive Profile Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <p class="label">PROFILE CARD</p>
            <h1>Interactive Profile</h1>
            <p class="subtitle">
                Kenali profil dan keterampilan saya.
            </p>
        </header>
        <div class="controls">
            <button id="muat" type="button" class="button button-primary">Muat Profil</button>
            <button id="coba-lagi" type="button" class="button" hidden>Coba Lagi</button>
            <button id="ganti-tema" type="button" class="button">Ganti Tema</button>
        </div>
        <p id="status" data-state="idle" class="status">Tekan tombol untuk memuat profil.</p>
        <section id="profil" class="profile-card" hidden>
            <div class="profile-content">
                <img src="foto/profile.jpg"alt="Foto profil"class="profile-avatar">
                <div class="profile-info">
                    <p class="profile-label">MAHASISWA</p>
                    <h2 id="nama-profil"></h2>
                    <p id="prodi-profil"></p>
                    <p id="deskripsi-profil"></p>
                </div>
            </div>
            <button id="tombol-detail" type="button" class="detail-button" aria-expanded="false">Lihat Detail</button>
            <div id="detail-profil" class="detail"><p id="email-profil"></p></div>
        </section>
        <section class="skill-card">
            <div class="section-heading">
                <div>
                    <p class="profile-label">KOMPETENSI</p>
                    <h2>Keterampilan</h2>
                </div>
            </div>
            <form id="form-skill" class="skill-form">
                <label for="input-skill">
                    Tambah keterampilan
                </label>
                <div class="input-group">
                    <input id="input-skill"type="text"placeholder="Contoh: Robotika">
                    <button type="submit" class="button button-primary">Tambah</button>
                </div>
                <p id="error-skill" class="error"></p>
            </form>
            <ul id="daftar-skill"></ul>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
