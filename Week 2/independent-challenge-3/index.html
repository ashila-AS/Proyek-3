<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Data Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="loader">
            <h1>Tips Belajar</h1>
            <div id="status" class="status">
                Tekan tombol untuk memuat tips belajar.
            </div>
            <p id="data" class="data"></p>
            <button id="tombolMuat">Muat Data</button>
            <button id="tombolCobaLagi" hidden>Coba Lagi</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
